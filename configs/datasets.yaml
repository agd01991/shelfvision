datasets:
  demo_coco:
    raw_dir: data/raw/demo_coco
    prepared_dir: data/prepared/demo_coco

    # На Этапе 1 поддерживается источник уже в COCO (bbox).
    source:
      type: coco_bbox
      coco_json: data/raw/demo_coco/annotations.json
      image_root: data/raw/demo_coco/images

    split:
      mode: group_by_parent_dir
      train: 0.8
      val: 0.1
      test: 0.1
      seed: 42

    validation:
      min_bbox_area: 16.0
      clip_to_image: true

    report:
      sample_per_split: 25
      draw_max_boxes: 80

  mini_coco:
    raw_dir: data/raw/mini_coco
    prepared_dir: data/prepared/mini_coco

    # На Этапе 1 поддерживается источник уже в COCO (bbox).
    source:
      type: coco_bbox
      coco_json: data/raw/mini_coco/annotations.json
      image_root: data/raw/mini_coco/images

    split:
      mode: random_by_image
      train: 0.8
      val: 0.1
      test: 0.1
      seed: 42

    validation:
      min_bbox_area: 16.0
      clip_to_image: true

    report:
      sample_per_split: 25
      draw_max_boxes: 80

    tiling:
      enabled: true
      tile_size: 1024
      overlap: 0.2
      min_visible: 0.25
      save_format: jpg
      jpeg_quality: 92

  sku110k:
    prepared_dir: data/prepared/sku110k
    source:
      type: sku110k_bbox
      images_dir: D:/datasets/SKU110K/images
      csv_path: D:/datasets/SKU110K/annotations.csv
      category_name: product
      category_id: 1
    split:
      mode: random_by_image
      train: 0.8
      val: 0.1
      test: 0.1
      seed: 42
    validation:
      min_bbox_area: 16.0
      clip_to_image: true
    report:
      sample_per_split: 25
      draw_max_boxes: 80
    tiling:
      enabled: true
      tile_size: 1024
      overlap: 0.2
      min_visible: 0.25

