# ShelfVision example configuration
# Copy this file to config/shelfvision.yaml and edit paths for your machine.

paths:
  images_dir: data/test/images
  image: data/test/image_001.jpg
  gt_coco: data/test/annotations.json
  gt_yolo_labels: data/test/labels
  out_dir: results/control_panel

segmentation:
  images_dir: data/yolo_cache/d2s_small_seg/images/test
  gt_coco: data/raw/d2s_small/annotations_test.json
  dataset_yaml: data/yolo_cache/d2s_small_seg/dataset.yaml
  out_dir: results/full_pipeline_seg

readiness:
  out_dir: "D:/1Diplom/shelfvision_results/readiness"

sku_gallery:
  gallery_dir: "D:/1Diplom/sku_gallery"
  output_csv: "D:/1Diplom/sku_gallery/gallery.csv"
  out_dir: "D:/1Diplom/shelfvision_results/sku_gallery"
  min_images_per_sku: 3

demo_sku_gallery:
  predictions: results/video/yolo/video_predictions.json
  images_dir: results/video/yolo/frames_for_identification
  gallery_dir: "D:/1Diplom/sku_gallery"
  gallery_csv: "D:/1Diplom/sku_gallery/gallery.csv"
  out_dir: "D:/1Diplom/shelfvision_results/demo_sku_gallery"
  max_sku: 30
  min_score: 0.35
  min_width: 20
  min_height: 20
  padding: 0.05
  use_masks: true
  prefix: sku_demo_
  keep_old_demo: false

full_photo_identification:
  images_dir: "D:/1Diplom/data/raw/d2s_full/images"
  gallery_images_dir: ""
  query_images_dir: ""
  out_dir: "D:/1Diplom/shelfvision_results/full_photo_identification"
  gallery_dir: "D:/1Diplom/sku_gallery_full"
  gallery_csv: "D:/1Diplom/sku_gallery_full/gallery.csv"
  model: yolo
  limit: 100
  gallery_count: 30
  query_count: 70
  gallery_limit: 0
  query_limit: 0
  max_sku: 50
  min_score: 0.35
  min_width: 20
  min_height: 20
  padding: 0.05
  prefix: sku_demo_
  keep_old_demo: false
  threshold: 0.65
  top_k: 3
  visualize_limit: 100
  resume: true
  skip_existing: true
  progress_every: 10
  no_visualize_inference: false

identification:
  # Большие crop-ы, визуализации и отчёты лучше хранить вне папки программы.
  # Для текущей ВКР используется отдельный диск/каталог:
  predictions: results/inference/yolo_seg_batch/predictions.json
  images_dir: data/yolo_cache/d2s_small_seg/images/test
  out_dir: "D:/1Diplom/shelfvision_results/identification"
  gallery_csv: "D:/1Diplom/sku_gallery/gallery.csv"
  gallery_dir: "D:/1Diplom/sku_gallery"
  gt_csv: ""
  threshold: 0.65
  top_k: 3
  padding: 0.05
  use_masks: true
  no_visualize: false
  visualize_limit: 30
  stabilize_tracks: true
  render_identified_video: true
  video_summary: ""
  identified_video_codec: mp4v

weights:
  yolo: models/yolo/best.pt
  yolo_seg: runs/yolo_seg/d2s_small_yolov8s_seg/weights/best.pt
  rtdetr: models/rtdetr/best.pt
  frcnn: models/faster_rcnn/model_final.pth

runtime:
  # If true, action buttons in Control Panel run scripts through WSL .venv_wsl.
  # Windows .venv is used only to launch the Control Panel itself.
  use_wsl_runtime: true
  conf: 0.25
  imgsz: 640
  device: "0"
  models:
    - yolo
    - rtdetr
    - wbf

wbf:
  iou: 0.55
  skip: 0.001
  yolo_weight: 1.0
  rtdetr_weight: 1.0

density:
  model: yolo
  rows: 3
  cols: 3
  limit: 20

video:
  model: yolo_seg
  input_path: data/video/test.mp4
  output_dir: results/video/yolo
  frame_skip: 3
  max_frames: 0
  save_video: true
  sample_frames: 8
  show_masks: true
  codec: mp4v
  save_frames_for_identification: true
  tracking_enabled: true
  tracking_iou: 0.3
  tracking_max_missing: 5
  progress_every: 10

setup:
  # Windows/local virtual environment used to launch Streamlit Control Panel.
  venv_dir: .venv
  # Linux virtual environment created and filled through WSL.
  venv_dir_wsl: .venv_wsl
  requirements: requirements.txt
  # Optional file downloads. Add your own URLs here if needed.
  downloads:
    - name: yolo_weights
      url: ""
      output: models/yolo/best.pt
    - name: yolo_seg_weights
      url: ""
      output: runs/yolo_seg/d2s_small_yolov8s_seg/weights/best.pt
    - name: rtdetr_weights
      url: ""
      output: models/rtdetr/best.pt
    - name: test_archive
      url: ""
      output: data/downloads/test_data.zip
